name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-win-engines.mjs
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: release/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Studio ${{ github.ref_name }}
          files: release/*.exe
          body: |
            **Установка:** скачайте `PDF-Studio-Setup-*.exe` и запустите.
            `PDF-Studio-Portable-*.exe` — версия без установки.
            Если Windows SmartScreen предупреждает: «Подробнее» → «Выполнить в любом случае».
