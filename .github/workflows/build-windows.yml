name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (без «v»)'
        default: '1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-win-engines.mjs
      - run: npx electron-vite build
      # Версия установщика и имён файлов = версия релиза (поле запуска или тег без «v»),
      # а не то, что записано в package.json.
      - name: Build installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: npx electron-builder --win --publish never -c.extraMetadata.version="${RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: release/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PDF Studio ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: release/*.exe
          body: |
            **Установка:** скачайте `PDF-Studio-Setup-*.exe` и запустите.
            `PDF-Studio-Portable-*.exe` — версия без установки.
            Если Windows SmartScreen предупреждает: «Подробнее» → «Выполнить в любом случае».
